# One-command stack: restic-web + Postgres.
#
# Local:
#   docker compose up --build
#   open http://127.0.0.1:8080
#
# Coolify (Docker Compose build pack): assigns SERVICE_PASSWORD_DB and
# SERVICE_FQDN_APP_8080 automatically. Local defaults use password "restic".
# Once deployed, pick what to back up on the app's Coolify page: new sites and
# databases show up there without changing this file.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: restic
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_DB:-restic}
      POSTGRES_DB: restic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restic -d restic"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    # Coolify proxies via Traefik; do not bind the host port (conflicts on shared nodes).
    # For local browser access, use docker-compose.override.yml (see README).
    #
    # Root is required to restore into host Docker volumes owned by site users
    # (e.g. www-data). The image defaults to uid 1001, which can back up those
    # paths but cannot write them back.
    user: "0:0"
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://restic:${SERVICE_PASSWORD_DB:-restic}@db:5432/restic?sslmode=disable
      PORT: "8080"
      ADDR: 0.0.0.0:8080
      RESTIC_WEB_DATA: /app/data
      # Coolify: generate FQDN and proxy to port 8080 (set domain in Coolify UI on service "app").
      SERVICE_FQDN_APP_8080:
    volumes:
      - appdata:/app/data
      # Coolify: all Docker named volumes on this host.
      # Read-write so backups can restore in place into site volumes (e.g. WordPress).
      # Folder paths look like:
      #   /docker-volumes/<volume-name>/_data
      #   /docker-volumes/<volume-name>/_data/wp-content
      # Caution: the app container can modify any named volume on the host.
      - /var/lib/docker/volumes:/docker-volumes:rw
      # Coolify storages that are host directories rather than named volumes,
      # under the same path, so every site's data is reachable without editing
      # this file again.
      - /data/coolify/applications:/data/coolify/applications:rw
      - /data/coolify/services:/data/coolify/services:rw
      # Docker socket: the Coolify page lists sites and databases from their
      # container labels, database backups run pg_dump / mariadb-dump inside the
      # database container (docker exec), and a restore can stop a site while it
      # writes. Caution: access to this socket is root on the host, so anyone
      # who can log in to this app controls the server's containers.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    # On redeploy the app stops its runs cleanly first (a database restore
    # rolls back, a stopped site is started again); give it time to.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/auth/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  pgdata:
  appdata:
