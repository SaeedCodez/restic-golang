<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>restic backup manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">⟳</div>
      <div>
        <h1>restic backup manager</h1>
        <p class="tagline">Named repositories, folders and jobs — with durable history</p>
      </div>
    </div>
    <div class="status-pills">
      <span id="resticPill" class="pill pill-muted">checking restic…</span>
      <span id="activePill" class="pill pill-idle">idle</span>
    </div>
  </header>

  <div id="globalBanner" class="banner hidden"></div>

  <nav class="tabs">
    <a class="tab" href="#/jobs" data-section="jobs">Jobs</a>
    <a class="tab" href="#/repositories" data-section="repositories">Repositories</a>
    <a class="tab" href="#/folders" data-section="folders">Folders</a>
    <a class="tab" href="#/activity" data-section="activity">Activity</a>
  </nav>

  <main id="view"><!-- rendered by app.js --></main>

  <footer class="foot">
    <span>Single-user local tool · no authentication · the backup engine is <code>restic</code></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
